##############################################################################
# Moodle Plugin CI - development pipeline for adaptivequizcatmodel_catquiz
#
# Runs on push / PR to every branch EXCEPT main.
#
#     lint-php (phplint, no Moodle install) ──▶ phpunit
#
# Both jobs tee their output into ci-logs/ and offer it as an "error summary"
# ZIP artifact. The full matrix runs on main via moodle-plugin-ci-main.yml.
#
# This sub-plugin lives inside mod/adaptivequiz/catmodel/catquiz, so the host
# module AND local_catquiz must be installed alongside it.
##############################################################################

name: Moodle Plugin CI Dev

on:
  # Cross-repo pinning (re-audit G3): the host and local_catquiz are taken from their branch heads,
  # which may not yet carry the commit this one was made for. A manual run can pin both to known SHAs.
  workflow_dispatch:
    inputs:
      host_ref:
        description: 'mod_adaptivequiz: commit SHA or branch (empty = branch head)'
        required: false
        default: ''
      catquiz_ref:
        description: 'local_catquiz: commit SHA or branch (empty = branch head)'
        required: false
        default: ''
      longrun:
        description: 'Heavy: the 160-item long run with the whole feedback path, 512 MiB (adapter #6)'
        required: false
        default: 'false'
  push:
    branches-ignore:
      - main
    tags:
      - '[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches-ignore:
      - main

concurrency:
  group: ci-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  lint-php:
    name: "PHP lint (phplint)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH

      - name: PHP Lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phplint plugin 2>&1 | tee ci-logs/phplint.log


      - name: Collect error summary
        if: ${{ always() }}
        run: |
          { echo "job: lint-php"; echo "status: ${{ job.status }}"; echo "commit: ${{ github.sha }}"; echo "ref: ${{ github.ref }}"; echo ""; echo "Logs:"; ls -1 ci-logs; } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-dev-lint-php
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  # -- Code analysis (no install; gates ci-complete, not the test suites) --
  # The Moodle Code Checker (phpcs) is a coding-style gate: it never affects
  # whether the code runs, so it is NOT a prerequisite of phpunit/behat (only
  # phplint is). It runs here, blocking, and this job gates ci-complete. phpmd /
  # phpcpd stay advisory (continue-on-error).
  phpunit:
    name: "PHPUnit / ${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
    runs-on: ubuntu-22.04
    needs: [lint-php]

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mirror.gcr.io/library/mariadb:11.4
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          # The line v-3.0 supports Moodle 5.1 to 5.3; every version on both databases (adapter #9: the
          # duplicate test takes cmactions from 5.2 on and the old functions on 5.1, both ways are run).
          # Moodle 5.3 needs PHP 8.3 or later; 8.1 and 8.2 could never install. MariaDB 11.4 serves all three.
          - { moodle: MOODLE_501_STABLE, php: '8.3', database: pgsql }
          - { moodle: MOODLE_501_STABLE, php: '8.3', database: mariadb }
          - { moodle: MOODLE_502_STABLE, php: '8.3', database: pgsql }
          - { moodle: MOODLE_502_STABLE, php: '8.3', database: mariadb }
          - { moodle: MOODLE_503_STABLE, php: '8.3', database: pgsql }
          - { moodle: MOODLE_503_STABLE, php: '8.3', database: mariadb }
          - { moodle: MOODLE_503_STABLE, php: '8.4', database: pgsql }

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle, dependencies and plugin
        run: |
          moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-local_wunderbyte_table
          moodle-plugin-ci add-plugin --branch v-3.0 ralferlebach/moodle-mod_adaptivequiz
          moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
          moodle-plugin-ci add-plugin --branch migration-zu-moodle-5.x ralferlebach/moodle-local_catquiz
          # Which commits are tested together - pinned on a manual run, reported always.
          pin() { [ -z "$2" ] && return 0; git -C "$1" fetch -q --depth 1 origin "$2" && git -C "$1" checkout -q FETCH_HEAD; }
          pin ./moodle-plugin-ci-plugins/moodle-mod_adaptivequiz "${{ github.event.inputs.host_ref }}"
          pin ./moodle-plugin-ci-plugins/moodle-local_catquiz "${{ github.event.inputs.catquiz_ref }}"
          for d in ./moodle-plugin-ci-plugins/moodle-mod_adaptivequiz ./moodle-plugin-ci-plugins/moodle-local_catquiz; do
            [ -d "$d/.git" ] && echo "::notice::$(basename "$d") @ $(git -C "$d" rev-parse HEAD)" || echo "::warning::$d not found"
          done
          echo "::notice::adaptivequizcatmodel_catquiz @ ${{ github.sha }}"
          moodle-plugin-ci add-plugin ralferlebach/moodle-catquizcentralhub_host
          moodle-plugin-ci add-plugin ralferlebach/moodle-catquizcentralhub_client
          # local_catquiz is cloned by add-plugin without its submodules; the checkout
          # leaves catquizcentralhub/host and catquizcentralhub/client behind as empty
          # directories. moodle-plugin-ci refuses to install into a directory that already
          # exists - it checks is_dir(), not whether a plugin is in it - and aborts with
          # "Plugin is already installed in standard Moodle". local_catquiz's own CI removes
          # the same placeholders; here they sit in the added plugin rather than the checkout.
          for placeholder in $(find ./moodle-plugin-ci-plugins -path '*catquizcentralhub/*' -mindepth 1 -type d -empty 2>/dev/null); do
            echo "leerer Submodul-Platzhalter entfernt: $placeholder"
            rmdir "$placeholder"
          done
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}

      # Strict (adapter #9): a notice or a deprecation fails the run. A debugging() call of the core - e.g. a
      # function deprecated in this Moodle version - reaches PHPUnit as a notice of advanced_testcase. moodle-plugin-ci
      # phpunit knows only --fail-on-warning, so PHPUnit is called directly, with the configuration the install wrote.
      - name: PHPUnit tests (strict - notices and deprecations fail)
        if: ${{ always() }}
        run: |
          set -o pipefail
          cd moodle
          vendor/bin/phpunit --testsuite adaptivequizcatmodel_catquiz_testsuite --testdox \
            --fail-on-warning --fail-on-notice --fail-on-deprecation --display-notices --display-deprecations \
            2>&1 | tee ../ci-logs/phpunit.log

      # Optional heavy job (adapter #6, audit 18.10.): only on a manual run with longrun = true, on PostgreSQL.
      # A skip is no green: the step fails unless the long run really ran and passed.
      - name: Long run with feedback (160 items, 512 MiB)
        if: ${{ github.event.inputs.longrun == 'true' && matrix.database == 'pgsql' && matrix.moodle == 'MOODLE_503_STABLE' && matrix.php == '8.3' }}
        env:
          CATQUIZ_LONGRUN: '1'
          CATQUIZ_LONGRUN_FEEDBACK: '1'
          CATQUIZ_LONGRUN_OUT: ${{ github.workspace }}/ci-logs/longrun.json
        run: |
          set -o pipefail
          cd moodle
          vendor/bin/phpunit --filter test_long_attempt_is_traced_request_by_request \
            public/mod/adaptivequiz/catmodel/catquiz/tests/longrun_test.php 2>&1 | tee ../ci-logs/longrun.log
          grep -q 'OK (1 test' ../ci-logs/longrun.log || { echo '::error::The long run did not run or did not pass.'; exit 1; }

      - name: Collect error summary
        if: ${{ always() }}
        run: |
          { echo "job: phpunit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }})"; echo "status: ${{ job.status }}"; echo "commit: ${{ github.sha }}"; echo "ref: ${{ github.ref }}"; echo ""; echo "Logs:"; ls -1 ci-logs; } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-dev-phpunit-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.database }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

