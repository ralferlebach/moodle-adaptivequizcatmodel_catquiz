##############################################################################
# Moodle Plugin CI - development pipeline for adaptivequizcatmodel_catquiz
#
# Runs on push / PR to every branch EXCEPT main.
#
#     lint-php (phplint, no Moodle install) ──▶ phpunit
#
# Both jobs tee their output into ci-logs/ and offer it as an "error summary"
# ZIP artifact. The full matrix runs on main via moodle-plugin-ci-main.yml.
#
# This sub-plugin lives inside mod/adaptivequiz/catmodel/catquiz, so the host
# module AND local_catquiz must be installed alongside it.
##############################################################################

name: Moodle Plugin CI Dev

on:
  # Cross-repo pinning (re-audit G3): the host and local_catquiz are taken from their branch heads,
  # which may not yet carry the commit this one was made for. A manual run can pin both to known SHAs.
  workflow_dispatch:
    inputs:
      host_ref:
        description: 'mod_adaptivequiz: commit SHA or branch (empty = branch head)'
        required: false
        default: ''
      catquiz_ref:
        description: 'local_catquiz: commit SHA or branch (empty = branch head)'
        required: false
        default: ''
      longrun:
        description: 'Heavy: the long run - 250 items and 12 people x 150 items at once, with the feedback (adapter #6, re-audit 19.11.2026)'
        required: false
        default: 'false'
  push:
    branches-ignore:
      - main
    tags:
      - '[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches-ignore:
      - main

concurrency:
  group: ci-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  lint-php:
    name: "PHP lint (phplint)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH

      - name: PHP Lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phplint plugin 2>&1 | tee ci-logs/phplint.log

      # The step that waits for the host (CI runs of 17.11.2026) is tested against local git origins.
      - name: Selbsttest des Warte-Skripts
        if: ${{ always() }}
        run: set -o pipefail; bash plugin/.github/scripts/await_dependencies_selftest.sh 2>&1 | tee ci-logs/await-selftest.log


      - name: Collect error summary
        if: ${{ always() }}
        run: |
          { echo "job: lint-php"; echo "status: ${{ job.status }}"; echo "commit: ${{ github.sha }}"; echo "ref: ${{ github.ref }}"; echo ""; echo "Logs:"; ls -1 ci-logs; } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-dev-lint-php
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  # -- Code analysis (no install; gates ci-complete, not the test suites) --
  # The Moodle Code Checker (phpcs) is a coding-style gate: it never affects
  # whether the code runs, so it is NOT a prerequisite of phpunit/behat (only
  # phplint is). It runs here, blocking, and this job gates ci-complete. phpmd /
  # phpcpd stay advisory (continue-on-error).
  phpunit:
    name: "PHPUnit / PHP ${{ matrix.php }} / ${{ matrix.database }}"
    runs-on: ubuntu-22.04
    needs: [lint-php]

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:13
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mirror.gcr.io/library/mariadb:10.8
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          # Issue #10: no cell runs PHP 8.1 or older. 8.2 takes PostgreSQL over from 8.1, so the lowest
          # PHP of the line still runs on both databases.
          - { php: '8.2', database: pgsql }
          - { php: '8.2', database: mariadb }
          - { php: '8.3', database: pgsql }
          # CI-Nacharbeitsauftrag 17.11.2026: Moodle 4.5 mit PHP 8.2 und 8.3, jeweils MariaDB und PostgreSQL.
          - { php: '8.3', database: mariadb }

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pcntl: the long run forks the processes of twelve people (re-audit 19.11.2026).
          extensions: pcntl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle, dependencies and plugin
        run: |
          moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-local_wunderbyte_table
          moodle-plugin-ci add-plugin --branch ALiSe-v-1.2.0-legacy ralferlebach/moodle-mod_adaptivequiz
          moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
          moodle-plugin-ci add-plugin --branch ALiSe-v-1.2.0-legacy ralferlebach/moodle-local_catquiz
          # Which commits are tested together - pinned on a manual run, reported always.
          pin() { [ -z "$2" ] && return 0; git -C "$1" fetch -q --depth 1 origin "$2" && git -C "$1" checkout -q FETCH_HEAD; }
          pin ./moodle-plugin-ci-plugins/moodle-mod_adaptivequiz "${{ github.event.inputs.host_ref }}"
          pin ./moodle-plugin-ci-plugins/moodle-local_catquiz "${{ github.event.inputs.catquiz_ref }}"
          # Push order (CI runs of 17.11.2026): this subplugin names the host version it needs in version.php. If the
          # host branch is still older, the host was pushed after this commit - wait for it (up to 15 min) instead of
          # failing on classes the old host lacks. A pinned host is not waited for. Script and self-test: .github/scripts/.
          # Re-audit of 22.11.2026: also the states of host and local_catquiz this delivery was tested with
          # (.github/ci-partner-versions.txt), so that the run names the commits of one delivery.
          AWAIT_PARTNERS=./plugin/.github/ci-partner-versions.txt bash ./plugin/.github/scripts/await_dependencies.sh \
            ./plugin/version.php \
            mod_adaptivequiz ./moodle-plugin-ci-plugins/moodle-mod_adaptivequiz ALiSe-v-1.2.0-legacy "${{ github.event.inputs.host_ref }}" \
            local_catquiz ./moodle-plugin-ci-plugins/moodle-local_catquiz ALiSe-v-1.2.0-legacy "${{ github.event.inputs.catquiz_ref }}"
          for d in ./moodle-plugin-ci-plugins/moodle-mod_adaptivequiz ./moodle-plugin-ci-plugins/moodle-local_catquiz; do
            [ -d "$d/.git" ] && echo "::notice::$(basename "$d") @ $(git -C "$d" rev-parse HEAD)" || echo "::warning::$d not found"
          done
          echo "::notice::adaptivequizcatmodel_catquiz @ ${{ github.sha }}"
          moodle-plugin-ci add-plugin ralferlebach/moodle-catquizcentralhub_host
          moodle-plugin-ci add-plugin ralferlebach/moodle-catquizcentralhub_client
          # local_catquiz is cloned by add-plugin without its submodules; the checkout
          # leaves catquizcentralhub/host and catquizcentralhub/client behind as empty
          # directories. moodle-plugin-ci refuses to install into a directory that already
          # exists - it checks is_dir(), not whether a plugin is in it - and aborts with
          # "Plugin is already installed in standard Moodle". The same placeholders are
          # removed in local_catquiz's own CI.
          for placeholder in $(find ./moodle-plugin-ci-plugins -path '*catquizcentralhub/*' -mindepth 1 -type d -empty 2>/dev/null); do
            echo "leerer Submodul-Platzhalter entfernt: $placeholder"
            rmdir "$placeholder"
          done
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: PHPUnit tests
        if: ${{ always() }}
        # Re-audit 19.11.2026 (CI P0): the call moodle-plugin-ci makes - vendor/bin/phpunit with the testsuite of the
        # component, from the Moodle root - plus a JUnit log, which the evidence step below reads.
        run: |
          set -o pipefail
          cd moodle
          vendor/bin/phpunit --testsuite adaptivequizcatmodel_catquiz_testsuite --testdox --fail-on-warning \
            --log-junit "$GITHUB_WORKSPACE/ci-logs/junit.xml" 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/phpunit.log"

      # Optional heavy job (adapter #6, audit 18.10.; re-audit 19.11.2026, long run P0): only on a manual run with
      # longrun = true, in one PostgreSQL cell. One person with 250 items - a pool with single-choice, true/false,
      # numerical and short-answer questions, a request that dies after the answer in the middle, question usage and
      # progress compared slot by slot, the stored bytes, a second finalisation - and twelve people at the same time
      # with 150 items each, in processes of their own. A skip is no green: the step fails unless both tests ran
      # and passed. The figures (JSON), the JUnit log and the RSS of the process (GNU time) are kept as evidence.
      - name: Long run with feedback (250 items; 12 people x 150 items at once)
        if: ${{ github.event.inputs.longrun == 'true' && matrix.database == 'pgsql' && matrix.php == '8.3' }}
        env:
          CATQUIZ_LONGRUN: '1'
          CATQUIZ_LONGRUN_FEEDBACK: '1'
          CATQUIZ_LONGRUN_ITEMS: '250'
          CATQUIZ_LONGRUN_PARALLEL: '12'
          CATQUIZ_LONGRUN_PARALLEL_ITEMS: '150'
          CATQUIZ_REQUIRE_CONCURRENCY: '1'
          CATQUIZ_LONGRUN_OUT: ${{ github.workspace }}/ci-logs/longrun.json
        run: |
          set -o pipefail
          cd moodle
          timer=""
          [ -x /usr/bin/time ] && timer="/usr/bin/time -v"
          $timer vendor/bin/phpunit --group longrun --testdox --log-junit ../ci-logs/longrun-junit.xml \
            mod/adaptivequiz/catmodel/catquiz/tests/longrun_test.php 2>&1 | tee ../ci-logs/longrun.log
          grep -q 'OK (2 tests' ../ci-logs/longrun.log || { echo '::error::The long run did not run or did not pass.'; exit 1; }
          {
            echo "## Long run (adapter, re-audit 19.11.2026)"
            echo
            grep -E 'Maximum resident set size|Elapsed \(wall clock\)' ../ci-logs/longrun.log | sed 's/^\s*/- /' || true
            echo
            echo '```'
            cat ../ci-logs/longrun.json.txt 2>/dev/null || true
            echo '```'
            echo
            echo 'Twelve people: `longrun-parallel.json` in the artefact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload long run evidence
        if: ${{ always() && github.event.inputs.longrun == 'true' && matrix.database == 'pgsql' && matrix.php == '8.3' }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-longrun-${{ matrix.php }}-${{ matrix.database }}
          path: |
            ci-logs/longrun*
          retention-days: 90
          if-no-files-found: warn

      # Re-audit 19.11.2026 (CI P0): which commits of engine, host and adapter ran together, on which Moodle, PHP
      # and database, how many tests and assertions, what was skipped - and the tests the issues name ran, passed
      # and were not skipped (the job fails otherwise). Also in the job summary.
      - name: Evidence (commits, versions, tests)
        if: ${{ always() }}
        env:
          CI_EVIDENCE_SELF: adaptivequizcatmodel_catquiz
        run: >-
          python3 plugin/.github/scripts/ci_evidence.py
          --title "PHPUnit / MOODLE_405_STABLE / PHP ${{ matrix.php }} / ${{ matrix.database }}"
          --moodle moodle --db ${{ matrix.database }}
          --component adaptivequizcatmodel_catquiz=plugin
          --component mod_adaptivequiz=moodle-plugin-ci-plugins/moodle-mod_adaptivequiz
          --component local_catquiz=moodle-plugin-ci-plugins/moodle-local_catquiz
          --junit ci-logs/junit.xml --required plugin/.github/ci-required-tests.txt
          --out ci-logs/evidence

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-phpunit-MOODLE_405_STABLE-${{ matrix.php }}-${{ matrix.database }}
          path: |
            ci-logs/evidence
            ci-logs/junit.xml
          retention-days: 90
          if-no-files-found: warn

      - name: Collect error summary
        if: ${{ always() }}
        run: |
          { echo "job: phpunit (PHP ${{ matrix.php }} / ${{ matrix.database }})"; echo "status: ${{ job.status }}"; echo "commit: ${{ github.sha }}"; echo "ref: ${{ github.ref }}"; echo ""; echo "Logs:"; ls -1 ci-logs; } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-dev-phpunit-${{ matrix.php }}-${{ matrix.database }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

