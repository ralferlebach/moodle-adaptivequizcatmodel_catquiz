##############################################################################
# Moodle Plugin CI - main (release) pipeline
#
# Runs ONLY on push / PR to main and provides the "CI complete" status check for
# branch protection. Full, SEQUENTIAL pipeline: every check runs in order inside
# each matrix cell (lint -> phpunit), across the full Moodle x PHP x DB
# matrix. The fast, parallelised pipeline in moodle-plugin-ci-dev.yml is used for
# development branches.
#
# Every check tees its output into ci-logs/, which is offered as a downloadable
# "error summary" ZIP artifact (always), and Behat failure dumps (screenshots +
# HTML) are offered as their own ZIP on failure.
##############################################################################

name: Moodle Plugin CI Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "CI / ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.8
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', moodle-branch: MOODLE_405_STABLE, database: pgsql }
          - { php: '8.1', moodle-branch: MOODLE_405_STABLE, database: mariadb }
          - { php: '8.2', moodle-branch: MOODLE_405_STABLE, database: pgsql }
          - { php: '8.2', moodle-branch: MOODLE_405_STABLE, database: mariadb }
          - { php: '8.3', moodle-branch: MOODLE_405_STABLE, database: pgsql }
          - { php: '8.3', moodle-branch: MOODLE_405_STABLE, database: mariadb }

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle, dependencies and plugin
        run: |
          moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-local_wunderbyte_table
          moodle-plugin-ci add-plugin --branch v-3.0 ralferlebach/moodle-mod_adaptivequiz
          moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
          moodle-plugin-ci add-plugin --branch main ralferlebach/moodle-local_catquiz
          moodle-plugin-ci add-plugin ralferlebach/moodle-catquizcentralhub_host
          moodle-plugin-ci add-plugin ralferlebach/moodle-catquizcentralhub_client
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          MUSTACHE_IGNORE_NAMES: 'feedbackform_collapsible_close.mustache,feedbackform_collapsible_open.mustache,catscaleshortcodetablechildren.mustache'

      - name: PHP Lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phplint 2>&1 | tee ci-logs/phplint.log

      - name: PHP Copy/Paste Detector
        continue-on-error: true
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpcpd 2>&1 | tee ci-logs/phpcpd.log

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpmd 2>&1 | tee ci-logs/phpmd.log

      - name: Moodle Code Checker
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci codechecker --max-warnings 0 --exclude=PSR1.Classes.ClassDeclaration,moodle.Commenting.TodoComment 2>&1 | tee ci-logs/codechecker.log

      - name: Moodle PHPDoc Checker
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpdoc --max-warnings 0 2>&1 | tee ci-logs/phpdoc.log

      - name: Validating
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci validate 2>&1 | tee ci-logs/validate.log

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci savepoints 2>&1 | tee ci-logs/savepoints.log

      - name: PHPUnit tests
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpunit --fail-on-warning --testdox 2>&1 | tee ci-logs/phpunit.log

      # ── Diagnostics: error summary ─────────────────────────────────────────
      - name: Collect error summary
        if: ${{ always() }}
        run: |
          {
            echo "job:    ${{ github.job }} (${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }})"
            echo "status: ${{ job.status }}"
            echo "commit: ${{ github.sha }}"
            echo "ref:    ${{ github.ref }}"
            echo ""
            echo "Collected logs (a non-empty *.log for a failing step holds the error):"
            ls -1 ci-logs
          } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-main-${{ matrix.php }}-${{ matrix.database }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

      - name: All matrix jobs must have succeeded
        run: |
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "All CI matrix jobs passed."
          else
            echo "CI result: ${{ needs.test.result }} - one or more jobs failed or were cancelled."
            exit 1
          fi
